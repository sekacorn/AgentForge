name: Release

on:
  push:
    tags:
      # Only version tags start a release. A bare "v" prefix would also match
      # names like "vendor-audit", which would start a run that can only fail
      # the tag/version check.
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to run against (for example v0.5.9)"
        required: true
        type: string
      dry_run:
        description: "Run every check but skip the PyPI upload"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Report the release mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "event_name     = ${EVENT}"
          echo "inputs.dry_run = '${DRY_RUN}'"
          if [ "${EVENT}" != "push" ] && [ "${DRY_RUN}" != "false" ]; then
            echo "mode           = DRY RUN (the PyPI upload and everything after it will be skipped)"
          else
            echo "mode           = REAL RELEASE (the PyPI upload will run)"
          fi

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e ".[all,dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy forge

      - name: Tests
        run: pytest --cov=forge --cov-branch

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Verify tag matches package version
        env:
          REF_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["REF_NAME"]
          text = pathlib.Path("forge/_version.py").read_text(encoding="utf-8")
          match = re.search(r'__version__ = "([^"]+)"', text)
          if match is None:
              sys.exit("Could not find __version__ in forge/_version.py")
          expected = f"v{match.group(1)}"
          if tag != expected:
              sys.exit(f"Tag {tag} does not match package version {expected}")
          print(f"release version verified: {expected}")
          PY

      - name: Build
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Skipped on a dry run. `inputs.dry_run` is empty on a push event,
    # so the event check comes first: a push is always a real release.
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Refuse to upload during a dry run
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${EVENT}" != "push" ] && [ "${DRY_RUN}" != "false" ]; then
            echo "This job must not run during a dry run. Failing instead of uploading."
            exit 1
          fi
          echo "Confirmed a real release: event=${EVENT} dry_run='${DRY_RUN}'"

      - name: Publish package distributions
        # v1.14.2 uses Twine 7+, which supports Core Metadata 2.5.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
