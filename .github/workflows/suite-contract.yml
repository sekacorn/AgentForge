name: Suite Contract

# AgentForge and the AI Infrastructure Suite take no code dependency on each
# other; the contract between them is the provider-inventory.v1 document,
# whose schema the suite owns. This job installs the suite from its main branch
# and checks every inventory `forge providers inventory` can write against that
# schema and the suite's reader, and that this package's endpoint-locality rule
# agrees with the suite's on the shared endpoint-locality-cases.v1 table.
#
# Its own workflow so it can carry a schedule: the suite changes on its own
# cadence, and a nightly run surfaces a break within a day.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[all,dev]" jsonschema
      - name: Install the suite from its main branch
        # Not a declared dependency: the suite depends on this package, not the
        # other way round. Installed for this job only; the contract tests skip
        # when it is absent so the offline matrix stays offline.
        run: |
          python -m pip install "git+https://github.com/sekacorn/AI-Infrastructure-Suite.git@main"
          python -c "import ai_infrastructure_suite as s; print('suite', s.__version__)"
      - name: Validate every inventory variant against the suite
        # The variable turns a missing suite into a failure, so a botched
        # install can never report this check as passing.
        env:
          AGENTFORGE_REQUIRE_SUITE_CONTRACT: "1"
        run: python -m pytest -v -o addopts="" tests/contract
